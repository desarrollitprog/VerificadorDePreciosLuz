name: Build APK Daily

on:
  schedule:
    - cron: '0 9 * * *'  # Daily at 9 AM UTC = 5 AM Caracas
  push:
    paths:
      - 'luzapp/**'
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Necesario para leer el historial
      
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Build debug APK
        run: |
          cd luzapp
          chmod +x gradlew
          ./gradlew assembleDebug
          
      - name: Get and increment version number
        id: version
        run: |
          # Leer versión actual o iniciar en 1
          if [ -f .version_number ]; then
            CURRENT=$(cat .version_number)
            NEXT=$((CURRENT + 1))
          else
            NEXT=1
          fi
          echo "build_number=$NEXT" >> $GITHUB_OUTPUT
          echo $NEXT > .version_number
          
      - name: Create version.json
        run: |
          BUILD_NUM=${{ steps.version.outputs.build_number }}
          DATE=$(date +%Y%m%d)
          CHECKSUM=$(sha256sum luzapp/app/build/outputs/apk/debug/*.apk | cut -d' ' -f1)
          # Versión: YYYYMMDD-BUILD (ej: 20260416-5)
          VERSION="${DATE}-${BUILD_NUM}"
          echo "{\"version\": \"$VERSION\", \"min_version\": \"1.0.0\", \"download_url\": \"/luzapp.apk\", \"checksum\": \"$CHECKSUM\", \"changelog\": \"Build #$BUILD_NUM - $DATE\"}" > version.json
        shell: bash
          
      - name: Copy APK
        run: cp luzapp/app/build/outputs/apk/debug/*.apk luzapp.apk
        shell: bash

      - name: Commit files to repo
        run: |
          git config --local user.email "github-actions@github.com"
          git config --local user.name "GitHub Actions"
          git add -f .version_number version.json luzapp.apk
          git commit -m "build: APK v${{ steps.version.outputs.build_number }} - $(date +%Y-%m-%d)" || echo "No changes to commit"
          git push origin main || (
            echo "Push rejected, trying pull and retry..."
            git pull --rebase origin main
            git push origin main
          )
        shell: bash