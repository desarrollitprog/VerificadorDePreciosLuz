name: Build APK Daily

on:
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM
  push:
    paths:
      - 'luzapp/**'
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Build debug APK
        run: cd luzapp && ./gradlew assembleDebug
        
      - name: Update version.json
        run: |
          VERSION=$(date +%Y%m%d)
          cd luzapp/app/build/outputs/apk/debug/
          APK=$(ls *.apk)
          CHECKSUM=$(sha256sum $APK | cut -d' ' -f1)
          cd ../../../..
          echo "{\"version\": \"$VERSION\", \"min_version\": \"1.0.0\", \"download_url\": \"https://Tavorl25.github.io/VerificadorDePreciosLuz/updates/luzapp.apk\", \"checksum\": \"$CHECKSUM\", \"changelog\": \"Actualización automática\"}" > updates/version.json
          
      - name: Copy APK to updates
        run: |
          cp luzapp/app/build/outputs/apk/debug/*.apk updates/luzapp.apk
          
      - name: Commit & Push
        run: |
          git config --local user.email "github-actions@github.com"
          git config --local user.name "GitHub Actions"
          git add updates/
          git commit -m "Daily APK update $(date +%Y-%m-%d)" || echo "No changes to commit"
          git push