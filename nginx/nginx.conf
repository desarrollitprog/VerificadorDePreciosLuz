# nginx.conf básico para servir React y hacer proxy al backend
server {
    listen 80;
    server_name _;
    # LÍMITES Y TIMEOUTS PARA ARCHIVOS PESADOS (100MB)
    client_max_body_size 100M;
    client_body_timeout 300s;
    client_header_timeout 300s;
    client_body_buffer_size 128k;
    keepalive_timeout 300s;
    send_timeout 300s;

    # Archivos estáticos del React build
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy al backend
    location /api/ {
        proxy_pass http://dashboard-backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
    }

    # Archivos estáticos del backend (banners)
    location /static/ {
        proxy_pass http://dashboard-backend:8000/static/;
        proxy_read_timeout 300s;
    }
}