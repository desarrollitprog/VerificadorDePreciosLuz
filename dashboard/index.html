<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video Manager Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#137fec",
              "background-light": "#f8f9fa",
              "background-dark": "#0f1114",
              "card-dark": "#161a21",
              "border-dark": "#252b36",
              // Colores sutiles adicionales
              surface: "#1a1f27",
              accent: "#3b82f6",
            },
            fontFamily: {
              sans: ["Inter", "sans-serif"],
              serif: ["Playfair Display", "serif"],
            },
            transitionDuration: {
              '250': '250ms',
            }
          },
        },
      };
    </script>
    <style>
      /* Custom Scrollbar - más sutil */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #475569;
      }
      
      /* Transiciones globales suaves */
      * {
        transition-property: background-color, border-color, color, fill, stroke;
        transition-duration: 200ms;
        transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
      }
      
      /* Focus ring más suave */
      :focus-visible {
        outline: 2px solid #3b82f6;
        outline-offset: 2px;
      }
      
      /* Page load animation */
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in {
        animation: fadeIn 0.4s ease-out forwards;
      }
      
      /* Color de selección más sutil */
      ::selection {
        background-color: rgba(59, 130, 246, 0.25);
        color: inherit;
      }
    </style>
  <link rel="stylesheet" href="/index.css">
</head>
  <body class="h-screen bg-background-light dark:bg-[#0f1114] text-slate-900 dark:text-white antialiased selection:bg-primary selection:text-white font-sans" style="background-image: linear-gradient(180deg, #0f1114 0%, #13161b 100%);">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
