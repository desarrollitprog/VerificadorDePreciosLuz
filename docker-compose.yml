version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-CU12-ubuntu-22.04
    container_name: dashboard-sqlserver
    environment:
      - TZ=America/Caracas
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${SA_PASSWORD:?SA_PASSWORD no esta definido en .env}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - mssql_data:/var/opt/mssql
      - ./backups:/backups
    ports:
      - "1433:1433"
    restart: always
    healthcheck:
      test: /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P ${SA_PASSWORD:?SA_PASSWORD no esta definido en .env} -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 5

  dashboard-redis:
    image: redis:7-alpine
    container_name: dashboard-redis
    ports:
      - "6380:6379"
    restart: always
    volumes:
      - dashboard_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    command: redis-server --maxmemory 512mb --maxmemory-policy noeviction

  dashboard-backend:
    build:
      context: ./backend-dashboard
      dockerfile: Dockerfile
    container_name: dashboard-backend
    env_file:
      - ./backend-dashboard/.env.dashboard
    environment:
      - REDIS_URL=redis://dashboard-redis:6379
    ports:
      - "8001:8000"
    restart: always
    volumes:
      - ./backend-dashboard/app/static/banners:/app/static/banners
    depends_on:
      sqlserver:
        condition: service_healthy
      dashboard-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  dashboard-frontend:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    container_name: dashboard-frontend
    ports:
      - "80:80"
    volumes:
      - ./updates:/usr/share/nginx/html/updates:ro
    depends_on:
      dashboard-backend:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  mssql_data:
  dashboard_redis_data:

networks:
  default:
    name: dashboard-network
