name: Build APK Daily

on:
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM
  push:
    paths:
      - 'luzapp/**'
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Build debug APK
        run: |
          cd luzapp
          chmod +x gradlew
          ./gradlew assembleDebug
        shell: bash
        
      - name: Update version.json
        run: |
          VERSION=$(date +%Y%m%d)
          APK_PATH="luzapp/app/build/outputs/apk/debug"
          APK=$(ls $APK_PATH/*.apk | head -1)
          CHECKSUM=$(sha256sum "$APK" | cut -d' ' -f1)
          echo "{\"version\": \"$VERSION\", \"min_version\": \"1.0.0\", \"download_url\": \"https://github.com/Tavorl25/VerificadorDePreciosLuz/releases/latest/download/luzapp.apk\", \"checksum\": \"$CHECKSUM\", \"changelog\": \"Actualización automática\"}" > version.json
        shell: bash
          
      - name: Copy APK
        run: cp luzapp/app/build/outputs/apk/debug/*.apk luzapp.apk
        shell: bash
          
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body: "Actualización automática del $(date +%Y-%m-%d)"
          files: luzapp.apk
          tag_name: v${{ github.run_number }}
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Upload version.json to repo
        run: |
          curl -s -X PUT https://uploads.github.com/repos/${{ github.repository }}/contents/version.json \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"message": "Update version.json", "content": "'"$(base64 -w0 version.json)"'"}'
        shell: bash