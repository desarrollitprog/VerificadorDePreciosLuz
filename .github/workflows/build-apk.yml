name: Build APK Daily

on:
  schedule:
    - cron: '0 9 * * *'  # Daily at 9 AM UTC = 5 AM Caracas
  push:
    paths:
      - 'luzapp/**'
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Build debug APK
        run: |
          cd luzapp
          chmod +x gradlew
          ./gradlew assembleDebug
          
      - name: Create version.json
        run: |
          VERSION=$(date +%Y%m%d)
          DATE=$(date +%Y-%m-%d)
          APK_PATH="luzapp/app/build/outputs/apk/debug"
          APK=$(ls $APK_PATH/*.apk | head -1)
          CHECKSUM=$(sha256sum "$APK" | cut -d' ' -f1)
          # Renombrar a luzapp.apk para el release
          cp "$APK" luzapp.apk
          echo "{\"version\": \"$VERSION\", \"min_version\": \"1.0.0\", \"download_url\": \"https://github.com/TavorL25/VerificadorDePreciosLuz/releases/download/daily/luzapp.apk\", \"checksum\": \"$CHECKSUM\", \"changelog\": \"Actualización automática del $DATE\"}" > version.json
        shell: bash
          
      - name: Upload APK to Release
        uses: softprops/action-gh-release@v1
        with:
          files: luzapp.apk
          generate_release_notes: true
          tag_name: daily
          name: "Daily Build"
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Commit version.json (sin APK)
        run: |
          git config --local user.email "github-actions@github.com"
          git config --local user.name "GitHub Actions"
          git add version.json
          git commit -m "Update version.json $(date +%Y%m%d)" || echo "No changes to commit"
          git push origin main || echo "Push skipped - no changes"
        shell: bash