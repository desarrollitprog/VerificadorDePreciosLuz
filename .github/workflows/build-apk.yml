name: Build APK Daily

on:
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM
  push:
    paths:
      - 'luzapp/**'
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Build debug APK
        run: |
          cd luzapp
          chmod +x gradlew
          ./gradlew assembleDebug
        shell: bash
        
      - name: Update version.json
        run: |
          VERSION=$(date +%Y%m%d)
          APK_PATH="luzapp/app/build/outputs/apk/debug"
          APK=$(ls $APK_PATH/*.apk | head -1)
          CHECKSUM=$(sha256sum "$APK" | cut -d' ' -f1)
          echo "{\"version\": \"$VERSION\", \"min_version\": \"1.0.0\", \"download_url\": \"https://Tavorl25.github.io/VerificadorDePreciosLuz/luzapp.apk\", \"checksum\": \"$CHECKSUM\", \"changelog\": \"Actualización automática\"}" > version.json
        shell: bash
          
      - name: Copy APK to root
        run: |
          cp luzapp/app/build/outputs/apk/debug/*.apk luzapp.apk
        shell: bash
          
      - name: Commit & Push
        run: |
          git config --local user.email "github-actions@github.com"
          git config --local user.name "GitHub Actions"
          git add -f version.json -f luzapp.apk
          git commit -m "Daily APK update $(date +%Y-%m-%d)" || echo "No changes to commit"
          git push https://${{ secrets.GITHUB_TOKEN }}@github.com/Tavorl25/VerificadorDePreciosLuz.git main
        shell: bash